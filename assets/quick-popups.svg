<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" height="auto" role="img" aria-label="Quick system pop-ups for volume, Bluetooth, battery, and Caps Lock">
  <title>Nook Quick System Pop-ups</title>
  <defs>
    <linearGradient id="popupCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <filter id="popupDropShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="720" height="250" rx="14" fill="url(#popupCardBg)" stroke="#1e2332" stroke-width="1.5" />

  <!-- Pop-up 1: Volume Slider -->
  <g transform="translate(60, 26)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#000000" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" filter="url(#popupDropShadow)" />
    
    <!-- Speaker Icon -->
    <path d="M 22 21 L 27 16 L 31 16 L 31 26 L 27 26 Z" fill="#ffffff" />
    <path d="M 34 18 C 35.5 19 36 20 36 21 C 36 22 35.5 23 34 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 37 15 C 39 17 40 19 40 21 C 40 23 39 25 37 27" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Progress Slider Bar -->
    <rect x="52" y="18" width="160" height="6" rx="3" fill="rgba(255, 255, 255, 0.18)" />
    <rect x="52" y="18" width="102" height="6" rx="3" fill="#ffffff" />

    <!-- Value -->
    <text x="246" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">64</text>
  </g>

  <!-- Pop-up 2: Bluetooth Device with Battery -->
  <g transform="translate(380, 26)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#000000" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" filter="url(#popupDropShadow)" />
    
    <!-- Bluetooth Icon (Blue) -->
    <path d="M 26 14 L 32 20 L 28 24 L 28 10 L 32 14 L 26 20" fill="none" stroke="#0a84ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Device Name & Status -->
    <text x="44" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">AirPods Pro</text>
    <text x="44" y="33" fill="rgba(255, 255, 255, 0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Connected</text>

    <!-- Battery Level Ring -->
    <circle cx="230" cy="21" r="10" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5" />
    <circle cx="230" cy="21" r="10" fill="none" stroke="#30d158" stroke-width="2.5" stroke-dasharray="62.8" stroke-dashoffset="9.4" stroke-linecap="round" transform="rotate(-90 230 21)" />
    <text x="257" y="25" fill="#30d158" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">85%</text>
  </g>

  <!-- Pop-up 3: Battery Charging -->
  <g transform="translate(60, 96)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#000000" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" filter="url(#popupDropShadow)" />
    
    <!-- Battery glyph with bolt -->
    <rect x="22" y="14" width="22" height="14" rx="3" fill="none" stroke="#30d158" stroke-width="1.5" />
    <rect x="44" y="18" width="2" height="6" rx="1" fill="#30d158" />
    <!-- Bolt -->
    <path d="M 33 13 L 29 21 L 33 21 L 31 29 L 37 20 L 33 20 Z" fill="#30d158" />

    <text x="56" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Charging</text>

    <text x="246" y="26" fill="#30d158" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">92%</text>
  </g>

  <!-- Pop-up 4: Caps Lock -->
  <g transform="translate(380, 96)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#000000" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" filter="url(#popupDropShadow)" />
    
    <!-- Lock Glyph -->
    <rect x="22" y="20" width="14" height="11" rx="2" fill="#ffffff" />
    <path d="M 25 20 L 25 16 C 25 13.5 33 13.5 33 16 L 33 20" fill="none" stroke="#ffffff" stroke-width="1.5" />

    <text x="48" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Caps Lock</text>
    <text x="246" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">On</text>
  </g>

  <!-- Bottom Caption -->
  <text x="360" y="196" fill="rgba(255, 255, 255, 0.65)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    Quick system pop-ups — responsive, tactile on-screen indicators that replace intrusive native flyouts
  </text>
  <text x="360" y="218" fill="rgba(255, 255, 255, 0.45)" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" text-anchor="middle">
    Volume • Brightness • Battery &amp; Charging • Wi-Fi • Bluetooth • Output Device • Caps Lock • Num Lock • Night Light
  </text>
</svg>
