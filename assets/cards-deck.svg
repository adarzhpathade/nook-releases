<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" height="auto" role="img" aria-label="Expandable cards deck navigated with mouse wheel">
  <title>Nook Expandable Cards Deck</title>
  <defs>
    <linearGradient id="cardsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>
    <filter id="cardDropShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="720" height="250" rx="14" fill="url(#cardsBg)" stroke="#1f2330" stroke-width="1.5" />

  <!-- Card 1: Today Card -->
  <g transform="translate(60, 24)">
    <rect x="0" y="0" width="260" height="150" rx="20" fill="#000000" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" filter="url(#cardDropShadow)" />
    
    <!-- Date -->
    <text x="24" y="32" fill="rgba(255, 255, 255, 0.55)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">THURSDAY, OCTOBER 23</text>
    
    <!-- Time -->
    <text x="24" y="74" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5">09:41</text>
    
    <!-- Weather Line -->
    <g transform="translate(24, 102)">
      <!-- Sun icon -->
      <circle cx="10" cy="10" r="5" fill="#ffd60a" />
      <line x1="10" y1="2" x2="10" y2="4" stroke="#ffd60a" stroke-width="1.5" stroke-linecap="round" />
      <line x1="10" y1="16" x2="10" y2="18" stroke="#ffd60a" stroke-width="1.5" stroke-linecap="round" />
      <line x1="2" y1="10" x2="4" y2="10" stroke="#ffd60a" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="10" x2="18" y2="10" stroke="#ffd60a" stroke-width="1.5" stroke-linecap="round" />

      <text x="26" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">24°</text>
      <text x="56" y="14" fill="rgba(255, 255, 255, 0.65)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">Sunny</text>
    </g>

    <!-- Card Name Label -->
    <text x="130" y="176" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Today Card</text>
  </g>

  <!-- Mouse Wheel Navigation Center Indicator -->
  <g transform="translate(345, 60)">
    <!-- Mouse body -->
    <rect x="7" y="0" width="16" height="26" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    <rect x="14" y="5" width="2" height="6" rx="1" fill="#64d2ff" />
    
    <!-- Vertical scroll arrows -->
    <path d="M 15 36 L 15 48 M 11 40 L 15 36 L 19 40" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 15 54 L 15 66 M 11 62 L 15 66 L 19 62" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="15" y="86" fill="rgba(255, 255, 255, 0.65)" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SCROLL</text>
  </g>

  <!-- Card 2: Timer Card -->
  <g transform="translate(400, 24)">
    <rect x="0" y="0" width="260" height="150" rx="20" fill="#000000" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" filter="url(#cardDropShadow)" />
    
    <!-- Circular countdown progress -->
    <circle cx="56" cy="62" r="32" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />
    <circle cx="56" cy="62" r="32" fill="none" stroke="#ff9f0a" stroke-width="4" stroke-dasharray="201" stroke-dashoffset="65" stroke-linecap="round" transform="rotate(-90 56 62)" />
    <text x="56" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Timer</text>

    <!-- Large Time Remaining -->
    <text x="108" y="58" fill="#ff9f0a" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" letter-spacing="0.5">14:59</text>
    <text x="108" y="76" fill="rgba(255, 255, 255, 0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">25 min Focus</text>

    <!-- Action Buttons -->
    <rect x="24" y="106" width="98" height="28" rx="14" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="73" y="124" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Cancel</text>

    <rect x="134" y="106" width="102" height="28" rx="14" fill="#ff9f0a" />
    <text x="185" y="124" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pause</text>

    <!-- Card Name Label -->
    <text x="130" y="176" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Timer Card</text>
  </g>

  <!-- Bottom Caption -->
  <text x="360" y="222" fill="rgba(255, 255, 255, 0.65)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    Expandable cards — click the island to expand; scroll smoothly between Today, Timer, Stopwatch, Music, Call, and Download
  </text>
</svg>
