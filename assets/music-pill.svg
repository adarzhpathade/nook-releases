<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="100%" height="auto" role="img" aria-label="Music live activity and hover peek">
  <title>Nook Music Live Activity</title>
  <defs>
    <linearGradient id="musicCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151722" />
      <stop offset="100%" stop-color="#0b0c13" />
    </linearGradient>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff375f" />
      <stop offset="50%" stop-color="#bf5af2" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
    <radialGradient id="albumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#bf5af2" stop-opacity="0" />
    </radialGradient>
    <filter id="musicDropShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="720" height="230" rx="14" fill="url(#musicCardBg)" stroke="#222533" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <ellipse cx="360" cy="140" rx="220" ry="60" fill="url(#albumGlow)" />

  <!-- Section 1: Compact Music Pill -->
  <g transform="translate(0, 16)">
    <rect x="270" y="8" width="180" height="36" rx="18" fill="#000000" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" filter="url(#musicDropShadow)" />
    
    <!-- Mini Album Art -->
    <rect x="276" y="14" width="24" height="24" rx="12" fill="url(#artGrad)" />
    
    <!-- Equaliser bars in album accent -->
    <g transform="translate(408, 20)">
      <rect x="0" y="5" width="2.5" height="11" rx="1.2" fill="#bf5af2" />
      <rect x="5" y="2" width="2.5" height="14" rx="1.2" fill="#bf5af2" />
      <rect x="10" y="7" width="2.5" height="9" rx="1.2" fill="#bf5af2" />
      <rect x="15" y="3" width="2.5" height="13" rx="1.2" fill="#bf5af2" />
    </g>

    <!-- Track label (compact) -->
    <text x="355" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Starboy</text>

    <text x="360" y="60" fill="rgba(255, 255, 255, 0.65)" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">
      Compact live pill — animated equaliser waves match album colour
    </text>
  </g>

  <!-- Section 2: Expanded Peek / Hover State -->
  <g transform="translate(0, 92)">
    <rect x="200" y="12" width="320" height="52" rx="26" fill="#000000" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.2" filter="url(#musicDropShadow)" />
    
    <!-- Album Art -->
    <rect x="210" y="20" width="36" height="36" rx="18" fill="url(#artGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8" />
    
    <!-- Track Title and Artist -->
    <text x="258" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Starboy</text>
    <text x="258" y="49" fill="rgba(255, 255, 255, 0.55)" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">The Weeknd</text>

    <!-- Play/Pause Circle Button -->
    <circle cx="488" cy="38" r="15" fill="#bf5af2" />
    <rect x="483" y="32" width="3" height="12" rx="1" fill="#ffffff" />
    <rect x="489" y="32" width="3" height="12" rx="1" fill="#ffffff" />

    <text x="360" y="92" fill="rgba(255, 255, 255, 0.65)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      Hover — track title, artist, play/pause button · scroll wheel adjusts volume
    </text>
  </g>
</svg>
