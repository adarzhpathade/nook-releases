<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Nook application icon">
  <title>Nook App Icon</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f232b" />
      <stop offset="100%" stop-color="#0c0e12" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#64d2ff" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Subtle screen edge highlight -->
  <line x1="28" y1="20" x2="100" y2="20" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-linecap="round" />

  <!-- Island Notch / Pill -->
  <rect x="24" y="32" width="80" height="30" rx="15" fill="#000000" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />

  <!-- Island Content Glow -->
  <circle cx="42" cy="47" r="5" fill="#0a84ff" filter="url(#softGlow)" opacity="0.6" />
  <circle cx="42" cy="47" r="3.5" fill="#0a84ff" />

  <!-- Equaliser wave bars inside island -->
  <rect x="54" y="43" width="2.5" height="8" rx="1.2" fill="#ffffff" />
  <rect x="60" y="40" width="2.5" height="14" rx="1.2" fill="#ffffff" />
  <rect x="66" y="44" width="2.5" height="6" rx="1.2" fill="#ffffff" />
  <rect x="72" y="41" width="2.5" height="12" rx="1.2" fill="#ffffff" />

  <!-- Secondary Dot / Status -->
  <circle cx="86" cy="47" r="3" fill="#30d158" />

  <!-- Modern Nook curve signature -->
  <path d="M 40 84 C 54 74, 74 74, 88 84" fill="none" stroke="url(#pillGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <circle cx="64" cy="94" r="2.5" fill="rgba(255, 255, 255, 0.4)" />
</svg>
