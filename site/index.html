<style>
  :root {
    --bg: #f4f4f1;
    --ink: #1f2124;
    --ink-2: #6d7075;
    --line: rgba(31, 33, 36, .22);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, "Segoe UI", sans-serif; font-weight: 300;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  /* the painting fades into the paper */
  .art {
    position: fixed; inset: 0 0 auto 0; height: 82vh;
    background: url("bg.jpg") center 35% / cover no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
    animation: fade 1.4s ease both;
  }
  main {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 16px 9vh; text-align: center;
  }
  h1 {
    font-weight: 300; line-height: 1; letter-spacing: -.035em;
    font-size: clamp(48px, 7.2vw, 112px);
    animation: rise 1s .15s cubic-bezier(.2, .8, .2, 1) both;
  }
  h1 em {
    font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400;
    letter-spacing: -.01em; font-size: 1.04em;
  }
  .small {
    margin-top: 16px; font-size: 14px; color: var(--ink-2); letter-spacing: .01em;
    animation: rise 1s .35s cubic-bezier(.2, .8, .2, 1) both;
  }
  .small a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .small a:hover { border-color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  footer {
    position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--ink-2); letter-spacing: .01em;
    animation: rise 1s .5s cubic-bezier(.2, .8, .2, 1) both;
  }
  footer a, footer b { color: var(--ink); text-decoration: none; font-weight: 500; }
  footer i { display: inline-block; width: 3px; height: 3px; margin: 0 10px; vertical-align: middle; border-radius: 50%; background: var(--ink-2); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<body>
<div class="art" role="img" aria-label="A meadow under a wide cloudy sky"></div>

<main>
  <h1>Nook, <em>thanks for trying.</em></h1>
  <p class="small" id="status" role="status" aria-live="polite">
    Your download is starting. <a id="dl" href="#">Download again</a>
  </p>
</main>

<footer>Developed by <a href="https://adrz-26.vercel.app/">Adarzh</a><i aria-hidden="true"></i>Powered by <b>Nook Flow</b></footer>

<script>
  // Set this to the hosted installer, e.g. "https://.../Nook_0.1.0_x64-setup.exe".
  var INSTALLER_URL = "https://github.com/adarzhpathade/nook-releases/releases/download/v0.1.2/Nook_0.1.2_x64-setup.exe";

  var link = document.getElementById("dl");
  var status = document.getElementById("status");
  var ready = INSTALLER_URL.indexOf("NOOK_") !== 0;

  link.href = ready ? INSTALLER_URL : "#";
  if (ready) link.setAttribute("download", "");
  else link.addEventListener("click", function (e) { e.preventDefault(); });

  setTimeout(function () {
    if (!ready) return;
    var a = document.createElement("a");
    a.href = INSTALLER_URL; a.download = ""; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    status.firstChild.textContent = "Your download has started. ";
  }, 900);
</script>
</body>
